[project]
name = "backend"
version = "0.1.0"
description = "FastAPI + LangGraph backend for Talk to Your Building"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.17.0",
    "fastapi>=0.162.0",
    "langchain-anthropic>=1.7.6",
    "langgraph>=1.2.17",
    "langsmith>=0.14.12",
    "pydantic-settings>=2.16.1",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["live: calls real external services (LangSmith); needs keys in .env"]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
