[project]
name = "backend"
version = "0.1.0"
description = "FastAPI + LangGraph backend for Talk to Your Building"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.17.0",
    "fastapi>=0.162.0",
    "jsonpatch>=1.36",
    "langchain-anthropic>=1.7.6",
    "langgraph>=1.2.17",
    "langsmith>=0.14.12",
    "mapbox-earcut>=2.1.0",
    "matplotlib>=3.11.2",
    "networkx>=3.4",
    "numpy>=2.4.6",
    "pydantic-settings>=2.16.1",
    "python-multipart>=0.0.32",
    "shapely>=2.2.0",
    "trimesh>=5.2.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.0",
    "poethepoet>=0.49.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.2",
    "types-shapely>=2.1.0.20260728",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["live: calls real external services (LangSmith); needs keys in .env"]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["navgraph", "navgraph_checks"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

# Cross-platform task runner: `uv run poe <task>` (the backend's `npm run`).
[tool.poe.tasks]
dev = { cmd = "uvicorn app.main:app --reload --port 8000", help = "Run the API with hot reload" }
test = { cmd = "pytest", help = "Run offline tests" }
test-live = { cmd = "pytest -m live", help = "Run tests that call LangSmith (needs keys in .env)" }
lint = { sequence = [
    { cmd = "ruff check ." },
    { cmd = "ruff format --check ." },
    { cmd = "mypy app scripts" },
], help = "Lint and type-check" }
format = { sequence = [
    { cmd = "ruff format ." },
    { cmd = "ruff check --fix ." },
], help = "Format and auto-fix" }
setup-managed-agent = { cmd = "python -m scripts.setup_managed_agent", help = "Create the Managed Agent once" }
ingest = { cmd = "python -m scripts.ingest", help = "Run the agentic ingestion pipeline on datasets" }

# trimesh is only partially typed; geometry code calls its untyped helpers.
[[tool.mypy.overrides]]
module = ["app.pipeline.tools.geo3d.*"]
disallow_untyped_calls = false
warn_return_any = false

[[tool.mypy.overrides]]
module = ["jsonpatch", "networkx", "trimesh.*"]
ignore_missing_imports = true

# navgraph/ is vendored from the industrial-agents-hackathon-2026 repo; keep it as-is.
[[tool.mypy.overrides]]
module = ["navgraph", "navgraph.*"]
ignore_errors = true
